[package]
name = "decider-engine"
version = "0.2.2"
edition = "2021"
rust-version = "1.98"
description = "Native Rust CPU inference for Strands Decider 2B"
license = "MIT"
repository = "https://github.com/ItsMick/decider-engine"
readme = "README.md"
exclude = [".github/**", "models/**", "*.part", "lambda/**"]

[features]
# Experimental until matched ARM end-to-end measurements establish the gain.
cache-blocking = []
fast-gemm = ["dep:ndarray"]
profile = []

[dependencies]
rayon = "1.11"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ndarray = { version = "=0.17.2", optional = true }

[dev-dependencies]
sha2 = "0.10"
