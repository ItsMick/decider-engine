[package]
name = "decider-engine"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Native Rust CPU inference for Strands Decider 2B"
license = "MIT"
repository = "https://github.com/ItsMick/decider-engine"
readme = "README.md"
exclude = [".github/**", "models/**", "*.part"]

[dependencies]
rayon = "1.11"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
