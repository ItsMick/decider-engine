[package]
name = "decider-engine"
version = "0.2.2"
edition = "2021"
rust-version = "1.98"
description = "Native Rust CPU inference for Strands Decider 2B"
license = "MIT"
repository = "https://github.com/ItsMick/decider-engine"
readme = "README.md"
exclude = [".github/**", "models/**", "*.part", "lambda/**"]

[features]
# Hand-written NEON kernels on little-endian AArch64; no effect on other
# targets. Results are bit-identical to the default build.
arm-neon = []

[dependencies]
rayon = "1.11"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[dev-dependencies]
sha2 = "0.10"
