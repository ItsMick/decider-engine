name: Pinned checkpoint parity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/fixtures/v21*reference.json'
      - 'scripts/generate-reference.py'
      - '.github/workflows/checkpoint-parity.yml'
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  parity:
    name: v21 checkpoint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RAYON_NUM_THREADS: '4'
      DECIDER_TEST_MODEL_DIR: models/v21
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Acquire pinned, hash-verified weights and licenses
        run: python3 scripts/download-model.py models/v21
      - name: Record machine, toolchain, source, and checkpoint revisions
        run: |
          mkdir -p validation
          {
            uname -a
            lscpu
            rustc -Vv
            cargo -V
            git rev-parse HEAD
            cat models/v21/revisions.json
            sha256sum tests/fixtures/v21*reference.json scripts/generate-reference.py
            echo "RAYON_NUM_THREADS=$RAYON_NUM_THREADS"
          } > validation/environment.txt
      - name: Required checkpoint-precision reference parity
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --test model -- --ignored --nocapture 2>&1 | tee validation/parity.log
      - name: Preserve validation evidence (no weights)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v21-parity-${{ matrix.os }}
          path: validation/
          retention-days: 30

  publish:
    name: Publish validated tag
    needs: parity
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.98.0'
      - name: Check package version matches tag
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'tag/package version mismatch'
          PY
      - name: Verify and package source
        run: cargo package --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: v21-parity-*
          path: validation
      - name: Publish only after both architecture gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf checkpoint-parity-evidence.tar.gz validation
          sha256sum target/package/*.crate checkpoint-parity-evidence.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            target/package/*.crate checkpoint-parity-evidence.tar.gz SHA256SUMS
