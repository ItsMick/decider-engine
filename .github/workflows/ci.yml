name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.98'
          - os: macos-latest
            rust: stable
          - os: ubuntu-24.04-arm
            rust: '1.98'
            rustflags: '-C target-cpu=neoverse-n1'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          DECIDER_REQUIRE_DOTPROD: ${{ (matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-latest') && '1' || '0' }}
      - name: Measure synthetic ARM projections
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          RAYON_NUM_THREADS: '4'
        run: cargo test --release --locked --lib benchmark_int8_projections -- --ignored --nocapture
      - name: Measure synthetic ARM attention
        if: matrix.os == 'ubuntu-24.04-arm'
        run: cargo test --release --locked --lib benchmark_causal_attention -- --ignored --nocapture
      - name: Measure synthetic ARM fusion
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          RAYON_NUM_THREADS: '4'
        run: cargo test --release --locked --lib benchmark_fused_projection -- --ignored --nocapture
