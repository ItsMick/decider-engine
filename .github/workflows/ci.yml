name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.98'
          - os: macos-latest
            rust: stable
          - os: ubuntu-24.04-arm
            rust: '1.98'
            rustflags: '-C target-cpu=neoverse-n1'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          DECIDER_REQUIRE_DOTPROD: ${{ (matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-latest') && '1' || '0' }}
      - name: Pinned v21 prompt binding (tokenizer only, no weights)
        shell: bash
        run: |
          mkdir -p encoder
          base=https://huggingface.co/StrandsAgents/strands-decider-2B-hobson-v21/resolve/2b52a6235c1b8306bbfa30b00b9d4b74b63a39f5
          for name in tokenizer.json strands_decider_config.json; do
            curl -fsSL --retry 3 -o "encoder/$name" "$base/$name"
          done
          python3 - <<'EOF'
          import hashlib
          from pathlib import Path
          pinned = {
              "tokenizer.json": "a2cdd2e108566b09079afa8d266e9e65e7c280f27b771218237a06de5ba9cd86",
              "strands_decider_config.json": "9b660cabb91ab9683dd62dee83e00a5ca30dff8657489e6ce473136f8d9eb529",
          }
          for name, digest in pinned.items():
              if hashlib.sha256(Path("encoder", name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"{name}: unexpected SHA256")
          EOF
          DECIDER_TEST_ENCODER_DIR=encoder cargo test --locked --test encoding -- --ignored
      - name: Lint and test the arm-neon feature
        if: matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-latest'
        env:
          DECIDER_REQUIRE_DOTPROD: '1'
        run: |
          cargo clippy --locked --all-targets --features arm-neon -- -D warnings
          cargo test --locked --features arm-neon
      - name: Profile real-size layer operators on ARM
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          RAYON_NUM_THREADS: '4'
          PROFILE_TOKENS: '64,512,2048'
        run: cargo test --release --locked --lib profile_layer_operators -- --ignored --nocapture
      - name: Profile real-size layer operators on ARM with arm-neon
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          RAYON_NUM_THREADS: '4'
          PROFILE_TOKENS: '64,512,2048'
        run: cargo test --release --locked --lib --features arm-neon profile_layer_operators -- --ignored --nocapture
      - name: Measure synthetic ARM projections
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          RAYON_NUM_THREADS: '4'
        run: cargo test --release --locked --lib benchmark_int8_projections -- --ignored --nocapture
      - name: Measure synthetic ARM attention
        if: matrix.os == 'ubuntu-24.04-arm'
        run: cargo test --release --locked --lib benchmark_causal_attention -- --ignored --nocapture
      - name: Measure synthetic ARM fusion
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          RAYON_NUM_THREADS: '4'
        run: cargo test --release --locked --lib benchmark_fused_projection -- --ignored --nocapture
  lambda-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: lambda
      - run: cargo fmt --manifest-path lambda/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path lambda/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path lambda/Cargo.toml
      - run: cargo build --locked --manifest-path lambda/Cargo.toml
      - name: Runtime API integration with synthetic weights
        env:
          DECIDER_LAMBDA_BIN: lambda/target/debug/decider-lambda
        run: python3 -m unittest discover -s scripts -p 'test_lambda_runtime.py'
