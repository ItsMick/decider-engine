name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.88'
          - os: macos-latest
            rust: stable
          - os: ubuntu-24.04-arm
            rust: stable
            rustflags: '-C target-cpu=neoverse-n1'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          DECIDER_REQUIRE_DOTPROD: ${{ (matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-latest') && '1' || '0' }}
      - name: Measure synthetic ARM projections
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          RAYON_NUM_THREADS: '4'
        run: cargo test --release --locked --lib benchmark_int8_projections -- --ignored --nocapture
